name: CI
 
on:
  push:
    branches: [ main ]
  workflow_dispatch:
 
jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
 
      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
 
      - name: Compiler et tester
        run: ./mvnw clean verify
        


